name: inzirax
description: Real-time driver navigation, camera warnings, and traffic alerts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_background_geolocation: ^4.16.6
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  geolocator: ^13.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mapbox_maps_flutter: ^2.6.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
